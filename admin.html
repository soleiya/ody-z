<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin — THE ODY-Z</title>
<link rel="icon" href="assets/logo-ody-z.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "3afba4cd8d6e4faca85f3fd2d2a06930"}'></script><!-- End Cloudflare Web Analytics -->
<style>
:root{
--bg: #07080a;
--bg-soft: #0e1013;
--panel: #131519;
--panel-2: #1a1d22;
--line: rgba(255,255,255,0.08);
--text: #f2f2f0;
--text-dim: #a8adb5;
--text-faint: #6b7078;
--blue: #4f9dff;
--ember: #ff6a3d;
--ember-2: #ff9142;
--gold: #c9a35a;
--danger: #ff6b6b;
--ok: #58d68d;
--radius: 14px;
--radius-sm: 8px;
color-scheme: dark;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
margin:0;
background:var(--bg);
color:var(--text);
font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
line-height:1.5;
-webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:'Bebas Neue',sans-serif;letter-spacing:0.02em;font-weight:400;margin:0;}
a{color:inherit;}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 80px;}

/* ---------- Passcode gate ---------- */
#gate{
position:fixed;inset:0;z-index:100;background:var(--bg);
display:flex;align-items:center;justify-content:center;padding:24px;
}
#gate .card{
width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);
border-radius:var(--radius);padding:28px 24px;text-align:center;
}
#gate h1{font-size:28px;margin-bottom:6px;}
#gate p{color:var(--text-dim);font-size:14px;margin:0 0 18px;}
#gate input{
width:100%;padding:12px 14px;border-radius:var(--radius-sm);border:1px solid var(--line);
background:var(--bg-soft);color:var(--text);font-size:15px;text-align:center;
letter-spacing:0.05em;margin-bottom:12px;font-family:inherit;
}
#gate input:focus{outline:none;border-color:var(--ember);}
#gate button{
width:100%;padding:12px 14px;border-radius:var(--radius-sm);border:none;
background:var(--ember);color:#fff;font-size:15px;font-weight:700;cursor:pointer;
font-family:inherit;
}
#gate button:disabled{opacity:0.55;cursor:default;}
#gate .err{color:var(--danger);font-size:13px;margin-top:12px;min-height:16px;}

/* ---------- Layout ---------- */
#app{display:none;}
header.top{
display:flex;align-items:center;justify-content:space-between;gap:16px;
flex-wrap:wrap;margin-bottom:28px;
}
header.top h1{font-size:34px;}
header.top .sub{color:var(--text-dim);font-size:13px;margin-top:2px;}
.top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.btn{
padding:9px 16px;border-radius:var(--radius-sm);border:1px solid var(--line);
background:var(--panel-2);color:var(--text);font-size:13px;font-weight:600;
cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;
}
.btn:hover{border-color:var(--ember);}
.btn.primary{background:var(--ember);border-color:var(--ember);color:#fff;}
.btn.ghost{background:transparent;color:var(--text-faint);}
#status-line{font-size:12px;color:var(--text-faint);}
#status-line .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:5px;}
#status-line .dot.stale{background:var(--gold);}

/* ---------- Stat tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:28px;}
.tile{
background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
padding:18px 20px;position:relative;overflow:hidden;
}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--tile-accent,var(--ember));}
.tile .num{font-family:'Bebas Neue',sans-serif;font-size:38px;line-height:1;color:var(--text);}
.tile .label{font-size:12px;color:var(--text-dim);margin-top:6px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;}
.tile .sub{font-size:12px;color:var(--text-faint);margin-top:4px;}

/* ---------- Breakdown cards ---------- */
.section-title{font-size:22px;margin:8px 0 14px;color:var(--text);}
.grid-breakdowns{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:28px;}
.bd-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;}
.bd-card h3{font-size:12px;font-family:'Inter',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-dim);margin-bottom:14px;}
.bd-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
.bd-row:last-child{margin-bottom:0;}
.bd-row .bd-label{flex:0 0 128px;font-size:13px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bd-row .bd-bar-track{flex:1;height:10px;background:var(--bg-soft);border-radius:6px;overflow:hidden;}
.bd-row .bd-bar-fill{height:100%;background:linear-gradient(90deg,var(--ember),var(--ember-2));border-radius:6px;min-width:3px;}
.bd-row .bd-count{flex:0 0 30px;text-align:right;font-size:13px;font-weight:700;color:var(--text);}
.bd-empty{color:var(--text-faint);font-size:13px;}

/* ---------- Table ---------- */
.table-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px 8px;}
.table-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
.table-head input{
padding:9px 12px;border-radius:var(--radius-sm);border:1px solid var(--line);
background:var(--bg-soft);color:var(--text);font-size:13px;font-family:inherit;min-width:220px;
}
.table-head input:focus{outline:none;border-color:var(--ember);}
.table-scroll{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap;}
thead th{
text-align:left;color:var(--text-faint);font-weight:600;text-transform:uppercase;
font-size:11px;letter-spacing:0.04em;padding:8px 10px;border-bottom:1px solid var(--line);
position:sticky;top:0;background:var(--panel);
}
tbody td{padding:10px 10px;border-bottom:1px solid var(--line);color:var(--text-dim);}
tbody tr:hover td{background:var(--panel-2);}
tbody td.name{color:var(--text);font-weight:600;}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;}
.pill.ok{background:rgba(88,214,141,0.14);color:var(--ok);}
.pill.pending{background:rgba(255,255,255,0.06);color:var(--text-faint);}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
#table-empty{color:var(--text-faint);font-size:13px;padding:20px 0;text-align:center;}
#table-count{color:var(--text-faint);font-size:12px;}

@media (max-width:640px){
header.top h1{font-size:26px;}
.tile .num{font-size:30px;}
.bd-row .bd-label{flex-basis:96px;}
}
</style>
</head>
<body>

<div id="gate">
<div class="card">
<h1>ODY-Z Admin</h1>
<p>Enter the admin passcode to view registrants.</p>
<input type="password" id="gate-input" placeholder="Passcode" autocomplete="off" spellcheck="false">
<button id="gate-btn">Unlock</button>
<div class="err" id="gate-err"></div>
</div>
</div>

<div id="app">
<div class="wrap">
<header class="top">
<div>
<h1>Registrants</h1>
<div class="sub">THE ODY-Z · Oct 30, 2026</div>
</div>
<div class="top-actions">
<span id="status-line"><span class="dot"></span><span id="status-text">Loading…</span></span>
<button class="btn" id="refresh-btn">↻ Refresh</button>
<button class="btn ghost" id="logout-btn">Log out</button>
</div>
</header>

<div class="tiles" id="tiles"></div>

<h2 class="section-title">Survey breakdown</h2>
<div class="grid-breakdowns" id="breakdowns"></div>

<h2 class="section-title">All registrants</h2>
<div class="table-card">
<div class="table-head">
<input type="text" id="search-input" placeholder="Search name or email…">
<span id="table-count"></span>
</div>
<div class="table-scroll">
<table>
<thead>
<tr>
<th>Name</th><th>Email</th><th>Phone</th><th>Party</th><th>Age</th>
<th>Staying</th><th>Drink</th><th>Style</th><th>Interests</th>
<th>Ticket</th><th>Status</th><th>Submitted</th>
</tr>
</thead>
<tbody id="table-body"></tbody>
</table>
<div id="table-empty" style="display:none;">No registrants match your search.</div>
</div>
</div>
</div>
</div>

<script>
(function(){
"use strict";
const SUPABASE_URL = "https://tdmveycuxkxihgxewwiq.supabase.co";
const SUPABASE_KEY = "sb_publishable_XId_hgYz7sZ-wbpkKCpHbw_YQvRdtgc";
const STORAGE_KEY = "odyz_admin_pass";
const REFRESH_MS = 30000;

const gate = document.getElementById('gate');
const gateInput = document.getElementById('gate-input');
const gateBtn = document.getElementById('gate-btn');
const gateErr = document.getElementById('gate-err');
const app = document.getElementById('app');
const statusText = document.getElementById('status-text');
const statusDot = document.querySelector('#status-line .dot');
const refreshBtn = document.getElementById('refresh-btn');
const logoutBtn = document.getElementById('logout-btn');
const searchInput = document.getElementById('search-input');

let rows = [];
let refreshTimer = null;
let lastLoadedAt = null;

function safeGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function safeSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function safeRemove(k){ try{ localStorage.removeItem(k); }catch(e){} }

async function fetchRows(passcode){
const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/admin_get_rsvps`, {
method: 'POST',
headers: {
'Content-Type': 'application/json',
apikey: SUPABASE_KEY,
Authorization: 'Bearer ' + SUPABASE_KEY,
},
body: JSON.stringify({ p_passcode: passcode }),
});
if (!res.ok){
let msg = 'Unable to load registrants.';
try{ const j = await res.json(); if (j && j.message) msg = j.message; }catch(e){}
throw new Error(msg);
}
return res.json();
}

function openGate(message){
gate.style.display = 'flex';
app.style.display = 'none';
if (message) gateErr.textContent = message;
gateInput.focus();
}

function closeGate(){
gate.style.display = 'none';
app.style.display = 'block';
}

async function unlock(passcode, fromStorage){
gateBtn.disabled = true;
gateBtn.textContent = 'Checking…';
gateErr.textContent = '';
try{
const data = await fetchRows(passcode);
rows = Array.isArray(data) ? data : [];
safeSet(STORAGE_KEY, passcode);
closeGate();
lastLoadedAt = new Date();
renderAll();
startAutoRefresh(passcode);
} catch(err){
if (!fromStorage) gateErr.textContent = 'Wrong passcode, or registrants couldn\'t be reached.';
safeRemove(STORAGE_KEY);
openGate(fromStorage ? '' : 'Wrong passcode, or registrants couldn\'t be reached.');
} finally {
gateBtn.disabled = false;
gateBtn.textContent = 'Unlock';
}
}

async function refresh(){
const passcode = safeGet(STORAGE_KEY);
if (!passcode) return;
statusText.textContent = 'Refreshing…';
try{
const data = await fetchRows(passcode);
rows = Array.isArray(data) ? data : [];
lastLoadedAt = new Date();
renderAll();
} catch(err){
statusDot.classList.add('stale');
statusText.textContent = 'Couldn\'t refresh — will retry';
}
}

function startAutoRefresh(){
if (refreshTimer) clearInterval(refreshTimer);
refreshTimer = setInterval(() => {
if (document.visibilityState === 'visible') refresh();
}, REFRESH_MS);
}

function fmtTime(iso){
if (!iso) return '—';
const d = new Date(iso);
if (isNaN(d.getTime())) return '—';
return d.toLocaleString(undefined, { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
}

function esc(s){
return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function updateStatusLine(){
statusDot.classList.remove('stale');
const t = lastLoadedAt ? lastLoadedAt.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit',second:'2-digit'}) : '—';
statusText.textContent = `${rows.length} registrants · updated ${t}`;
}

function renderTiles(){
const total = rows.length;
const completed = rows.filter(r => r.completed).length;
const checkedIn = rows.filter(r => r.checked_in_at).length;
const vouchers = rows.filter(r => r.voucher_redeemed_at).length;
const tiles = [
{ num: total, label: 'Total RSVPs', accent: 'var(--ember)' },
{ num: completed, label: 'Completed survey', sub: total ? Math.round(completed/total*100)+'%' : '', accent: 'var(--blue)' },
{ num: checkedIn, label: 'Checked in', sub: total ? Math.round(checkedIn/total*100)+'%' : '', accent: 'var(--ok)' },
{ num: vouchers, label: 'Vouchers redeemed', accent: 'var(--gold)' },
];
document.getElementById('tiles').innerHTML = tiles.map(t => `
<div class="tile" style="--tile-accent:${t.accent}">
<div class="num">${t.num}</div>
<div class="label">${esc(t.label)}</div>
${t.sub ? `<div class="sub">${esc(t.sub)}</div>` : ''}
</div>
`).join('');
}

function tally(values){
const counts = {};
values.forEach(v => {
if (v === null || v === undefined || v === '') return;
counts[v] = (counts[v] || 0) + 1;
});
return Object.entries(counts).sort((a,b) => b[1]-a[1]);
}

function renderBreakdownCard(title, entries, totalForPct){
const max = entries.length ? entries[0][1] : 0;
if (!entries.length){
return `<div class="bd-card"><h3>${esc(title)}</h3><div class="bd-empty">No answers yet.</div></div>`;
}
const rowsHtml = entries.map(([label, count]) => `
<div class="bd-row">
<div class="bd-label" title="${esc(label)}">${esc(label)}</div>
<div class="bd-bar-track"><div class="bd-bar-fill" style="width:${max ? Math.max(3, count/max*100) : 0}%"></div></div>
<div class="bd-count">${count}</div>
</div>
`).join('');
return `<div class="bd-card"><h3>${esc(title)}</h3>${rowsHtml}</div>`;
}

function renderBreakdowns(){
const fields = [
{ key: 'party_size', title: 'Party size' },
{ key: 'age_bracket', title: 'Age bracket' },
{ key: 'staying_over', title: 'Staying arrangement' },
{ key: 'drink_pref', title: 'Drink preference' },
{ key: 'going_out_style', title: 'Going-out style' },
];
let html = fields.map(f => renderBreakdownCard(f.title, tally(rows.map(r => r[f.key])))).join('');

// interests is stored as a comma-separated multi-select string
const interestCounts = tally(
rows.flatMap(r => (r.interests ? String(r.interests).split(',').map(s => s.trim()).filter(Boolean) : []))
);
html += renderBreakdownCard('Interests (multi-select)', interestCounts);

document.getElementById('breakdowns').innerHTML = html;
}

function statusPill(row){
if (row.checked_in_at) return `<span class="pill ok"><span class="dot"></span>Checked in</span>`;
if (row.completed) return `<span class="pill pending"><span class="dot"></span>Not arrived</span>`;
return `<span class="pill pending"><span class="dot"></span>Incomplete</span>`;
}

function renderTable(){
const q = searchInput.value.trim().toLowerCase();
const filtered = q ? rows.filter(r =>
(r.name && r.name.toLowerCase().includes(q)) ||
(r.email && r.email.toLowerCase().includes(q))
) : rows;
const sorted = [...filtered].sort((a,b) => new Date(b.created_at) - new Date(a.created_at));

document.getElementById('table-count').textContent = `${filtered.length} of ${rows.length}`;
const tbody = document.getElementById('table-body');
const empty = document.getElementById('table-empty');

if (!sorted.length){
tbody.innerHTML = '';
empty.style.display = 'block';
return;
}
empty.style.display = 'none';
tbody.innerHTML = sorted.map(r => `
<tr>
<td class="name">${esc(r.name) || '—'}</td>
<td>${esc(r.email) || '—'}</td>
<td>${esc(r.phone) || '—'}</td>
<td>${esc(r.party_size) || '—'}</td>
<td>${esc(r.age_bracket) || '—'}</td>
<td>${esc(r.staying_over) || '—'}</td>
<td>${esc(r.drink_pref) || '—'}</td>
<td>${esc(r.going_out_style) || '—'}</td>
<td>${esc(r.interests) || '—'}</td>
<td>${esc(r.ticket_id) || '—'}</td>
<td>${statusPill(r)}</td>
<td>${fmtTime(r.created_at)}</td>
</tr>
`).join('');
}

function renderAll(){
updateStatusLine();
renderTiles();
renderBreakdowns();
renderTable();
}

gateBtn.addEventListener('click', () => {
const v = gateInput.value.trim();
if (v) unlock(v, false);
});
gateInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') gateBtn.click(); });
refreshBtn.addEventListener('click', refresh);
logoutBtn.addEventListener('click', () => {
safeRemove(STORAGE_KEY);
if (refreshTimer) clearInterval(refreshTimer);
rows = [];
gateInput.value = '';
openGate('');
});
searchInput.addEventListener('input', renderTable);

const saved = safeGet(STORAGE_KEY);
if (saved){
unlock(saved, true);
} else {
openGate('');
}
})();
</script>
</body>
</html>
